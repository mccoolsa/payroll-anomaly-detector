[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "payroll-anomaly-detector"
version = "1.0.0"
description = "A portfolio-grade payroll anomaly detection and investigation system."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.14,<2",
    "faker>=37,<38",
    "joblib>=1.4,<2",
    "numpy>=2.1,<3",
    "pandas>=2.2,<3",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.7,<3",
    "scikit-learn>=1.6,<2",
    "sqlalchemy>=2.0,<3",
    "streamlit>=1.41,<2",
]

[project.optional-dependencies]
dev = [
    "pre-commit>=4,<5",
    "pytest>=8.3,<9",
    "pytest-cov>=6,<7",
    "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
include = ["app*", "data_generation*", "database*"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -ra"
filterwarnings = [
    "ignore:Setting the shape on a NumPy array has been deprecated:DeprecationWarning",
]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
extend-exclude = ["database/migrations/versions"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.format]
quote-style = "double"
