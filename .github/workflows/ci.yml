name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: payroll
          POSTGRES_USER: payroll
          POSTGRES_PASSWORD: payroll
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U payroll -d payroll"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      PAYROLL_DATABASE_URL: postgresql+psycopg://payroll:payroll@localhost:5432/payroll
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check .
      - name: Formatting
        run: python -m ruff format --check .
      - name: Verify PostgreSQL migrations
        run: python scripts/init_db.py
      - name: Test
        run: >-
          python -m pytest
          --cov=app
          --cov=data_generation
          --cov=database
          --cov-report=term-missing
          --cov-fail-under=80
      - name: Build application image
        run: docker build --tag payroll-anomaly-detector:ci .

